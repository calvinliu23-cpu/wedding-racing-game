<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>婚禮賽車大戰 - 後台管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { background: #241b42; }
</style>
</head>
<body class="min-h-screen text-white p-6 font-fun">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-extrabold mb-1">🎛️ 婚禮賽車大戰 — 後台管理 👑</h1>
    <p id="statusBadge" class="inline-block px-3 py-1 rounded-full text-sm mb-6" style="background:rgba(255,211,105,.2); color:#FFD369;">狀態：WAITING</p>

    <div class="grid md:grid-cols-2 gap-6">

      <!-- 設定區 -->
      <section class="rounded-2xl p-5 space-y-5" style="background:#352a5c;">
        <h2 class="text-xl font-bold border-b border-white/10 pb-2">⚙️ 賽事設定</h2>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-sm font-bold" style="color:#5FC9E8;">隊伍 A — 屹耳新波藍隊</label>
            <input id="teamAName" type="text" placeholder="屹耳新波藍隊" maxlength="20"
              class="w-full rounded-lg px-3 py-2 bg-white/10 border border-white/20 outline-none" />
            <input id="teamAAvatarFile" type="file" accept="image/*" class="text-xs w-full" />
            <img id="teamAAvatarPreview" class="w-16 h-16 rounded-full object-cover border-2" style="border-color:#5FC9E8;" />
          </div>
          <div class="space-y-2">
            <label class="text-sm font-bold" style="color:#FFA552;">隊伍 B — 小橘隊</label>
            <input id="teamBName" type="text" placeholder="小橘隊" maxlength="20"
              class="w-full rounded-lg px-3 py-2 bg-white/10 border border-white/20 outline-none" />
            <input id="teamBAvatarFile" type="file" accept="image/*" class="text-xs w-full" />
            <img id="teamBAvatarPreview" class="w-16 h-16 rounded-full object-cover border-2" style="border-color:#FFA552;" />
          </div>
        </div>

        <div>
          <label class="text-sm font-bold text-white/80">遊戲時長（秒）</label>
          <input id="durationInput" type="number" min="10" max="600" value="90"
            class="w-32 rounded-lg px-3 py-2 bg-white/10 border border-white/20 outline-none" />
        </div>

        <button id="saveConfigBtn" class="w-full py-3 rounded-xl font-bold transition" style="background:linear-gradient(135deg,#C9B6F7,#8B6FE0);">
          💾 儲存設定
        </button>
        <p id="configSaved" class="text-sm text-center hidden" style="color:#AEEBD9;">已同步到大螢幕 ✓</p>
      </section>

      <!-- 流程控制 -->
      <section class="rounded-2xl p-5 space-y-3" style="background:#352a5c;">
        <h2 class="text-xl font-bold border-b border-white/10 pb-2">🕹️ 流程控制</h2>

        <button id="btnQR" class="w-full py-3 rounded-xl font-bold transition bg-white/10 hover:bg-white/20">
          📱 顯示 QR Code（回到等待畫面）
        </button>
        <button id="btnCountdown" class="w-full py-3 rounded-xl font-bold text-slate-900 transition" style="background:#FFD369;">
          ⏱️ 開始倒數 (3-2-1)
        </button>
        <button id="btnStart" class="w-full py-3 rounded-xl font-bold text-slate-900 transition" style="background:#AEEBD9;">
          🏁 遊戲開始（啟動計時與計分）
        </button>
        <div class="grid grid-cols-2 gap-3">
          <button id="btnForceEnd" class="py-3 rounded-xl font-bold transition text-slate-900" style="background:#FFB888;">
            ⏹️ 強制結束
          </button>
          <button id="btnReset" class="py-3 rounded-xl font-bold transition text-white" style="background:#E8637A;">
            🔄 重置遊戲
          </button>
        </div>

        <div class="pt-2 border-t border-white/10 mt-2">
          <div class="flex justify-between text-sm text-white/70 mb-1">
            <span>⏳ 剩餘時間</span><span id="liveTimer">--</span>
          </div>
          <div class="flex justify-between text-lg font-extrabold">
            <span id="liveTeamAScore" style="color:#5FC9E8;">A: 0</span>
            <span id="liveTeamBScore" style="color:#FFA552;">B: 0</span>
          </div>
        </div>
      </section>
    </div>

    <!-- 即時玩家列表 -->
    <section class="rounded-2xl p-5 mt-6" style="background:#352a5c;">
      <h2 class="text-xl font-bold border-b border-white/10 pb-2 mb-3">👥 即時玩家名單（依點擊數排序）</h2>
      <div class="flex gap-4 text-sm text-white/60 mb-2">
        <span>在線人數：<span id="onlineCount" class="text-white font-bold">0</span></span>
      </div>
      <div id="playerList" class="max-h-64 overflow-y-auto text-sm divide-y divide-white/10"></div>
    </section>

    <!-- 結算結果 -->
    <section id="resultSection" class="hidden rounded-2xl p-5 mt-6 border-2" style="background:#352a5c; border-color:#FFD369;">
      <h2 class="text-xl font-bold mb-3">🏆 結算結果</h2>
      <p id="resultWinner" class="text-lg font-extrabold mb-1"></p>
      <p id="resultMvp" class="font-bold" style="color:#FFD369;"></p>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
