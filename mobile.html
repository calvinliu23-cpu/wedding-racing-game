<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>婚禮賽車大戰 🏎️✨</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { background: #2C2250; }
</style>
</head>
<body class="min-h-screen text-white flex flex-col relative fairytale-bg">

  <div class="sparkle-field">
    <span class="sparkle" style="top:8%; left:10%;">✨</span>
    <span class="sparkle" style="top:18%; left:80%; animation-delay:.6s;">⭐</span>
    <span class="sparkle" style="top:60%; left:5%; animation-delay:1.2s;">✨</span>
    <span class="sparkle" style="top:75%; left:88%; animation-delay:.3s;">💫</span>
  </div>

  <!-- 畫面 1：登入 / 選隊 -->
  <div id="screen-join" class="flex-1 flex flex-col items-center justify-center px-6 fade-in relative z-10">
    <div class="text-5xl mb-2">👑🏎️💨</div>
    <h1 class="font-fun text-2xl font-extrabold mb-1 text-center">婚禮現場互動賽車大戰</h1>
    <p class="text-pink-100/80 text-sm mb-8">加入戰隊，狂點手機幫隊伍衝第一！</p>

    <div class="w-full max-w-sm space-y-4">
      <div>
        <label class="text-sm text-pink-100/90 mb-1 block font-fun">你的暱稱</label>
        <input id="nicknameInput" maxlength="12" placeholder="例如：新郎表弟阿翔"
          class="w-full rounded-2xl px-4 py-3 bg-white/95 text-slate-800 border-2 border-white focus:border-yellow-300 outline-none text-lg font-fun" />
      </div>

      <div>
        <label class="text-sm text-pink-100/90 mb-1 block font-fun">選擇你的隊伍</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="teamA-btn" class="team-choice-btn cute-card rounded-3xl p-4 text-center border-4 border-transparent">
            <div id="teamA-avatar" class="w-16 h-16 mx-auto rounded-full flex items-center justify-center text-2xl mb-2 overflow-hidden border-4 border-white shadow-md" style="background:var(--team-a-soft);">👑</div>
            <div id="teamA-name" class="font-fun font-bold text-slate-800">屹耳新波藍隊</div>
            <div id="teamA-count" class="text-xs text-slate-500 mt-1">0 人已加入</div>
          </button>
          <button type="button" id="teamB-btn" class="team-choice-btn cute-card rounded-3xl p-4 text-center border-4 border-transparent">
            <div id="teamB-avatar" class="w-16 h-16 mx-auto rounded-full flex items-center justify-center text-2xl mb-2 overflow-hidden border-4 border-white shadow-md" style="background:var(--team-b-soft);">🐾</div>
            <div id="teamB-name" class="font-fun font-bold text-slate-800">小橘隊</div>
            <div id="teamB-count" class="text-xs text-slate-500 mt-1">0 人已加入</div>
          </button>
        </div>
      </div>

      <button id="joinBtn" disabled
        class="w-full py-4 rounded-full font-fun font-extrabold text-lg transition shadow-lg">
        請先選擇隊伍
      </button>
      <p id="joinError" class="text-red-300 text-sm text-center hidden"></p>
    </div>
  </div>

  <!-- 畫面 2：等待開賽 -->
  <div id="screen-waiting" class="hidden flex-1 flex flex-col items-center justify-center px-6 fade-in text-center relative z-10">
    <div id="waitingCard" class="cute-card rounded-3xl p-8 w-full max-w-sm border-4 pulse-glow">
      <div id="waitingAvatar" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-3 overflow-hidden border-4 border-white shadow-md"></div>
      <div class="text-sm text-slate-500 font-fun">你是</div>
      <div id="waitingNickname" class="text-xl font-fun font-extrabold mb-1 text-slate-800"></div>
      <div id="waitingTeam" class="text-lg font-fun font-bold mb-6"></div>
      <div class="animate-pulse text-amber-600 font-fun font-bold">🎤 等待主持人開賽...</div>
    </div>
  </div>

  <!-- 畫面 3：倒數 -->
  <div id="screen-countdown" class="hidden fixed inset-0 flex items-center justify-center bg-black/80 z-50">
    <div id="countdownDisplay" class="countdown-number text-9xl font-extrabold" style="color:var(--gold);">3</div>
  </div>

  <!-- 畫面 4：遊戲進行 -->
  <div id="screen-game" class="hidden flex-1 flex flex-col relative overflow-hidden z-10">
    <div class="flex justify-between items-center px-5 pt-4 pb-2 text-sm font-fun">
      <div>
        <div class="text-pink-100/70">個人點擊</div>
        <div id="myClicks" class="text-2xl font-extrabold" style="color:var(--gold);">0</div>
      </div>
      <div id="gameTimer" class="text-3xl font-extrabold text-white">90</div>
      <div class="text-right">
        <div class="text-pink-100/70">隊伍總分</div>
        <div id="teamClicks" class="text-2xl font-extrabold">0</div>
      </div>
    </div>

    <div class="flex-1 flex items-center justify-center relative px-8">
      <button id="tapButton" class="tap-button w-full max-w-xs aspect-square rounded-full font-fun font-extrabold text-3xl text-white shadow-2xl relative border-8 border-white/40">
        用力點我！
      </button>
    </div>
    <p class="text-center text-pink-100/70 text-xs pb-4 font-fun">狂點螢幕幫隊伍加速衝刺 ✨🔥</p>
  </div>

  <!-- 畫面 5：結束 -->
  <div id="screen-end" class="hidden flex-1 flex flex-col items-center justify-center px-6 fade-in text-center relative z-10">
    <div class="text-5xl mb-3">🏁👑</div>
    <h2 class="text-2xl font-fun font-extrabold mb-4">比賽結束！</h2>
    <div class="cute-card rounded-3xl p-6 w-full max-w-sm mb-4">
      <div class="text-slate-500 text-sm font-fun">你的最終點擊數</div>
      <div id="finalMyClicks" class="text-4xl font-fun font-extrabold" style="color:var(--gold-deep);">0</div>
    </div>
    <p class="text-pink-100/80 text-sm font-fun">請抬頭看大螢幕，結果即將揭曉 🎉</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mobile.js"></script>
</body>
</html>
